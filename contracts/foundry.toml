[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Conservative EVM target until Whitechain's supported hardfork is confirmed (hour-1 test 2)
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
whitechain_sepolia = "${WHITECHAIN_RPC_URL}"
local = "http://127.0.0.1:8545"

[fuzz]
runs = 512
